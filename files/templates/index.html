<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholarship & Internship Finder</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 30px 16px;
    }

    /* ── Page wrapper ── */
    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 32px;
      color: #fff;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 1.05rem;
      opacity: 0.85;
      margin-top: 8px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      margin-bottom: 28px;
    }
    .card h2 {
      font-size: 1.3rem;
      color: #333;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
    }

    /* ── Form Grid ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    label span {
      color: #e74c3c;
    }
    input, select, textarea {
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    textarea { resize: vertical; min-height: 80px; }
    .hint {
      font-size: 0.78rem;
      color: #999;
      margin-top: 4px;
    }

    /* ── Submit Button ── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }
    .btn-submit:hover { opacity: 0.92; }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Loading Spinner ── */
    .loading {
      display: none;
      text-align: center;
      padding: 32px;
      color: #666;
      font-size: 1rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #eee;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error Banner ── */
    .error-banner {
      display: none;
      background: #fef0f0;
      border: 1.5px solid #e74c3c;
      border-radius: 10px;
      padding: 14px 18px;
      color: #c0392b;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    /* ── Results Section ── */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .results-count {
      font-size: 0.9rem;
      color: #888;
      background: #f5f5f5;
      padding: 4px 12px;
      border-radius: 20px;
    }

    /* ── Result Card ── */
    .result-card {
      border: 1.5px solid #eee;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .result-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }
    .result-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 5px;
      border-radius: 12px 0 0 12px;
    }
    .result-card.scholarship::before { background: #27ae60; }
    .result-card.internship::before  { background: #2980b9; }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
    }
    .result-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #222;
    }
    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-scholarship { background: #d5f5e3; color: #1e8449; }
    .badge-internship  { background: #d6eaf8; color: #1a5276; }

    /* ── Match Score Bar ── */
    .match-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 10px;
    }
    .match-label {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
    }
    .match-bar-bg {
      flex: 1;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .match-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.8s ease;
    }
    .match-percent {
      font-size: 0.85rem;
      font-weight: 700;
      color: #667eea;
      min-width: 38px;
      text-align: right;
    }

    /* ── Result Details Grid ── */
    .result-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }
    .detail-item {
      display: flex;
      flex-direction: column;
    }
    .detail-label {
      font-size: 0.75rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .detail-value {
      font-size: 0.9rem;
      font-weight: 600;
      color: #444;
    }
    .detail-skills {
      font-size: 0.82rem;
      color: #666;
      font-weight: 400;
    }

    /* ── No results state ── */
    .no-results {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    .no-results .emoji { font-size: 2.5rem; }

    /* ── Responsive ── */
    @media (max-width: 560px) {
      .form-grid { grid-template-columns: 1fr; }
      .card { padding: 20px; }
      .header h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>🎓 Scholarship & Internship Finder</h1>
    <p>Powered by Machine Learning — Tell us about yourself and we'll find the best matches</p>
  </div>

  <!-- Form Card -->
  <div class="card">
    <h2>📝 Your Profile</h2>

    <div class="error-banner" id="errorBanner"></div>

    <div class="form-grid">

      <!-- Field of Study -->
      <div class="form-group">
        <label>Field of Study <span>*</span></label>
        <select id="fieldOfStudy">
          <option value="">-- Select your field --</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Data Science">Data Science</option>
          <option value="Engineering">Engineering</option>
          <option value="Mathematics">Mathematics</option>
          <option value="Science">Science</option>
          <option value="Medicine">Medicine</option>
          <option value="Business">Business</option>
          <option value="Design">Design</option>
          <option value="Economics">Economics</option>
          <option value="Psychology">Psychology</option>
          <option value="Environmental Science">Environmental Science</option>
          <option value="Law">Law</option>
          <option value="Communications">Communications</option>
          <option value="Political Science">Political Science</option>
          <option value="Social Sciences">Social Sciences</option>
          <option value="Education">Education</option>
        </select>
      </div>

      <!-- CGPA -->
      <div class="form-group">
        <label>CGPA <span>*</span></label>
        <input type="number" id="gpa" placeholder="e.g. 8.5" min="0" max="10.0" step="0.1" />
        <span class="hint">Out of 10.0 — only eligible opportunities will show</span>
      </div>

      <!-- Skills -->
      <div class="form-group full-width">
        <label>Your Skills <span>*</span></label>
        <input type="text" id="skills"
          placeholder="e.g. Python, Machine Learning, SQL, Data Analysis" />
        <span class="hint">Separate skills with commas</span>
      </div>

      <!-- Interests -->
      <div class="form-group full-width">
        <label>Interests & Goals</label>
        <textarea id="interests"
          placeholder="e.g. I want to work on AI research and build machine learning products..."></textarea>
      </div>

      <!-- Preferred Type -->
      <div class="form-group">
        <label>Looking For</label>
        <select id="preferredType">
          <option value="both">Both Scholarships & Internships</option>
          <option value="scholarship">Scholarships Only</option>
          <option value="internship">Internships Only</option>
        </select>
      </div>

      <!-- Preferred Location -->
      <div class="form-group">
        <label>Preferred Location</label>
        <input type="text" id="preferredLocation" placeholder="e.g. Kolkata, Bangalore, Remote" />
      </div>

    </div>

    <button class="btn-submit" id="submitBtn" onclick="getRecommendations()">
      🔍 Find My Best Matches
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" id="loadingSection">
    <div class="spinner"></div>
    <p>Our ML model is finding your best matches...</p>
  </div>

  <!-- Results Section (hidden initially) -->
  <div class="card" id="resultsSection" style="display: none;">
    <div class="results-header">
      <h2>✨ Your Top Matches</h2>
      <span class="results-count" id="resultsCount">0 results</span>
    </div>
    <div id="resultsContainer"></div>
  </div>

</div>

<script>
  async function getRecommendations() {
    // 1. Collect form values
    const fieldOfStudy   = document.getElementById("fieldOfStudy").value.trim();
    const gpa            = document.getElementById("gpa").value.trim();
    const skills         = document.getElementById("skills").value.trim();
    const interests      = document.getElementById("interests").value.trim();
    const preferredType  = document.getElementById("preferredType").value;
    const preferredLocation = document.getElementById("preferredLocation").value.trim();

    // 2. Simple validation
    const errorBanner = document.getElementById("errorBanner");
    errorBanner.style.display = "none";

    if (!fieldOfStudy) { showError("Please select your field of study."); return; }
    if (!gpa)          { showError("Please enter your CGPA.");             return; }
    if (!skills)       { showError("Please enter at least one skill.");    return; }
    if (parseFloat(gpa) < 0 || parseFloat(gpa) > 10.0) {
      showError("CGPA must be between 0.0 and 10.0.");
      return;
    }

    // 3. Show loading, hide results
    document.getElementById("submitBtn").disabled = true;
    document.getElementById("loadingSection").style.display = "block";
    document.getElementById("resultsSection").style.display = "none";

    // 4. Build the request payload
    const payload = {
      field_of_study:      fieldOfStudy,
      gpa:                 parseFloat(gpa),
      skills:              skills,
      interests:           interests,
      preferred_type:      preferredType,
      preferred_location:  preferredLocation,
    };

    // 5. Send POST request to the Flask backend
    try {
      const response = await fetch("/recommend", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(payload),
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        showError(data.error || "Something went wrong. Please try again.");
        return;
      }

      // 6. Render the results
      renderResults(data.recommendations);

    } catch (err) {
      showError("Could not connect to the server. Make sure Flask is running.");
    } finally {
      document.getElementById("submitBtn").disabled = false;
      document.getElementById("loadingSection").style.display = "none";
    }
  }


  function renderResults(recommendations) {
    const container = document.getElementById("resultsContainer");
    const section   = document.getElementById("resultsSection");
    const countEl   = document.getElementById("resultsCount");

    countEl.textContent = `${recommendations.length} result${recommendations.length !== 1 ? "s" : ""}`;
    section.style.display = "block";

    if (recommendations.length === 0) {
      container.innerHTML = `
        <div class="no-results">
          <div class="emoji">😕</div>
          <p style="margin-top:12px">No matches found. Try lowering your GPA or broadening your preferences.</p>
        </div>`;
      return;
    }

    container.innerHTML = recommendations.map((rec, index) => {
      const isScholarship = rec.type === "scholarship";
      const typeLabel     = isScholarship ? "Scholarship" : "Internship";
      const badgeClass    = isScholarship ? "badge-scholarship" : "badge-internship";

      // Clamp match bar to max 95% visually (raw cosine can go over with GPA bonus)
      const barWidth = Math.min(rec.match_percent * 1.5, 95).toFixed(1);

      // Rank emoji
      const rankEmoji = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"][index] || "⭐";

      // Format amount
      const amountLabel = isScholarship
        ? `₹${rec.amount.toLocaleString()} award`
        : `₹${rec.amount.toLocaleString()} stipend`;

      return `
        <div class="result-card ${rec.type}">
          <div class="result-top">
            <div class="result-title">${rankEmoji} ${rec.title}</div>
            <div class="badges">
              <span class="badge ${badgeClass}">${typeLabel}</span>
            </div>
          </div>

          <!-- Match Score Bar -->
          <div class="match-row">
            <span class="match-label">Match</span>
            <div class="match-bar-bg">
              <div class="match-bar-fill" style="width: ${barWidth}%"></div>
            </div>
            <span class="match-percent">${barWidth}%</span>
          </div>

          <!-- Details Grid -->
          <div class="result-details">
            <div class="detail-item">
              <span class="detail-label">Field</span>
              <span class="detail-value">${rec.field}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Amount</span>
              <span class="detail-value">${amountLabel}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Min GPA</span>
              <span class="detail-value">${rec.min_gpa.toFixed(1)}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Location</span>
              <span class="detail-value">${rec.location}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Deadline</span>
              <span class="detail-value">${rec.deadline}</span>
            </div>
            <div class="detail-item" style="grid-column: 1/-1">
              <span class="detail-label">Skills Required</span>
              <span class="detail-skills">${rec.skills_required}</span>
            </div>
          </div>
        </div>`;
    }).join("");

    // Smooth scroll to results
    section.scrollIntoView({ behavior: "smooth", block: "start" });
  }


  function showError(message) {
    const banner = document.getElementById("errorBanner");
    banner.textContent = "⚠️  " + message;
    banner.style.display = "block";
    document.getElementById("loadingSection").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
  }
</script>

</body>
</html>
